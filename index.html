<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe · Soft UI</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#E3E5F5',
            sage: '#A5B5A5',
            lavender: '#D1C4E9',
            muted: '#A3B1C6',
            ink: '#4A4A4A',
            offwhite: '#F7F7F4'
          },
          fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Anime.js -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

  <style>
    :root {
      --bg: #E3E5F5;
      --sd: #bec1d6;
      --sl: #ffffff;
      --ink: #4A4A4A;
      --x: #A3B1C6;
      --o: #A5B5A5;
      --lav: #D1C4E9;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Poppins', system-ui, sans-serif;
      margin: 0;
    }

    /* ---------- Neumorphism ---------- */
    .neu-raised {
      background: var(--bg);
      box-shadow: 10px 10px 22px var(--sd), -10px -10px 22px var(--sl);
    }
    .neu-inset {
      background: var(--bg);
      box-shadow: inset 5px 5px 10px var(--sd), inset -5px -5px 10px var(--sl);
    }
    .neu-btn {
      background: var(--bg);
      box-shadow: 5px 5px 10px var(--sd), -5px -5px 10px var(--sl);
      transition: box-shadow .22s ease, transform .18s ease;
    }
    .neu-btn:hover {
      box-shadow: 3px 3px 6px var(--sd), -3px -3px 6px var(--sl);
    }
    .neu-btn:active {
      box-shadow: inset 4px 4px 8px var(--sd), inset -4px -4px 8px var(--sl);
      transform: scale(.97);
    }
    .neu-select:focus-within {
      outline: 2px solid var(--lav);
      outline-offset: 2px;
    }
    .neu-select select { color: var(--ink); }
    .neu-select select option { background: var(--bg); }

    /* ---------- Turn Indicator ---------- */
    .pill {
      background: var(--bg);
      box-shadow: 5px 5px 10px var(--sd), -5px -5px 10px var(--sl);
      transition: box-shadow .3s ease, opacity .3s ease;
      opacity: .6;
    }
    .pill.active {
      box-shadow: inset 4px 4px 9px var(--sd), inset -4px -4px 9px var(--sl);
      opacity: 1;
    }
    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: transparent;
      transition: background .3s ease;
    }
    .pill.active .dot { animation: pulse 1.4s ease-in-out infinite; }
    #pillX.active .dot { background: var(--x); }
    #pillO.active .dot { background: var(--o); }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: .45; }
    }

    .badge {
      box-shadow: 3px 3px 6px var(--sd), -3px -3px 6px var(--sl);
      text-shadow: 1px 1px 2px rgba(120,125,150,.35), -1px -1px 2px #fff;
    }

    .thinking span {
      display: inline-block;
      animation: blink 1.2s infinite both;
    }
    .thinking span:nth-child(2) { animation-delay: .2s; }
    .thinking span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

    /* ---------- Board & Responsive Sizing ---------- */
    .board-wrap {
      width: 100%;
    }
    .board {
      display: grid;
      width: 100%;
      aspect-ratio: 1 / 1;
      gap: var(--gap, 12px);
    }
    .cell {
      width: 100%;
      height: 100%;
      border-radius: var(--r, 20px);
      background: var(--bg);
      box-shadow: inset 5px 5px 10px var(--sd), inset -5px -5px 10px var(--sl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc((100vw - 56px) / var(--n) * 0.44);
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .22s ease, background .32s ease;
      outline: none;
    }
    @media (min-width: 768px) {
      .board-wrap {
        width: min(80vh, calc(100vw - 380px), 560px);
      }
      .cell {
        font-size: calc(min(80vh, calc(100vw - 380px), 560px) / var(--n) * 0.44);
      }
    }
    @media (min-width: 1024px) {
      .board-wrap {
        width: min(82vh, calc(100vw - 420px), 600px);
      }
      .cell {
        font-size: calc(min(82vh, calc(100vw - 420px), 600px) / var(--n) * 0.44);
      }
    }

    .cell:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }
    .cell:not(.filled):hover {
      box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl);
    }
    .board.locked .cell { cursor: default; }
    .board.locked .cell:not(.filled):hover {
      box-shadow: inset 5px 5px 10px var(--sd), inset -5px -5px 10px var(--sl);
    }
    .cell.filled {
      cursor: default;
      box-shadow: inset 3px 3px 7px var(--sd), inset -3px -3px 7px var(--sl);
    }
    .mark {
      display: inline-block;
      text-shadow: 2px 2px 4px rgba(120,125,150,.35), -2px -2px 4px rgba(255,255,255,.95);
      will-change: transform, opacity;
    }
    .cell.is-x .mark { color: var(--x); }
    .cell.is-o .mark { color: var(--o); }

    .cell.win {
      background: linear-gradient(145deg, #ddd3f0, #c9bce2);
      box-shadow: 5px 5px 10px var(--sd), -5px -5px 10px var(--sl);
    }
    .cell.win.is-x .mark { color: #6f80a3; text-shadow: 1px 1px 2px rgba(255,255,255,.6); }
    .cell.win.is-o .mark { color: #6e866e; text-shadow: 1px 1px 2px rgba(255,255,255,.6); }

    .board.done .cell:not(.win) {
      opacity: .72;
      transition: opacity .35s ease, box-shadow .22s ease;
    }

    /* ---------- Result Modal (Soft UI + Backdrop Blur) ---------- */
    .modal-backdrop {
      background: rgba(227, 229, 245, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .modal-card {
      background: var(--bg);
      box-shadow: 16px 16px 32px var(--sd), -16px -16px 32px var(--sl);
    }
    .modal-emblem {
      background: var(--bg);
      box-shadow: inset 5px 5px 10px var(--sd), inset -5px -5px 10px var(--sl);
    }
    .modal-count-pill {
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--sd), inset -4px -4px 8px var(--sl);
    }
  </style>
</head>

<body class="min-h-screen w-full flex flex-col md:flex-row md:w-screen md:h-screen md:overflow-hidden antialiased">

  <!-- TOP PANEL (Mobile) / LEFT SIDEBAR (Desktop) -->
  <aside class="w-full md:w-[320px] lg:w-[350px] shrink-0 p-3 sm:p-4 md:p-6 flex flex-col md:h-full">
    <div class="neu-raised rounded-[20px] md:rounded-[24px] p-3.5 sm:p-4 md:p-6 flex flex-col gap-3 md:gap-5 md:h-full md:justify-center">

      <!-- Title -->
      <h1 class="text-lg sm:text-xl md:text-2xl font-extrabold tracking-tight text-center text-ink">
        Tic<span class="text-muted">·</span>Tac<span class="text-sage">·</span>Toe
      </h1>

      <!-- Controls: Horizontal compact bar on mobile, stacked on desktop -->
      <div class="grid grid-cols-[1fr_1fr_auto] md:grid-cols-1 gap-2.5 md:gap-4 items-end">
        <label class="block">
          <span class="block text-[10px] md:text-[11px] font-semibold uppercase tracking-wider text-ink/60 ml-1.5 mb-1">Grid</span>
          <div class="neu-btn neu-select relative rounded-2xl">
            <select id="sizeSelect" class="w-full appearance-none bg-transparent py-2.5 md:py-3 pl-3 md:pl-4 pr-8 text-xs sm:text-sm font-semibold outline-none cursor-pointer rounded-2xl">
              <option value="3" selected>3 × 3</option>
              <option value="4">4 × 4</option>
              <option value="5">5 × 5</option>
            </select>
            <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-ink/50" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
          </div>
        </label>

        <label class="block">
          <span class="block text-[10px] md:text-[11px] font-semibold uppercase tracking-wider text-ink/60 ml-1.5 mb-1">Kesulitan</span>
          <div class="neu-btn neu-select relative rounded-2xl">
            <select id="difficultySelect" class="w-full appearance-none bg-transparent py-2.5 md:py-3 pl-3 md:pl-4 pr-8 text-xs sm:text-sm font-semibold outline-none cursor-pointer rounded-2xl">
              <option value="easy">Mudah</option>
              <option value="medium" selected>Sedang</option>
              <option value="hard">Sulit</option>
            </select>
            <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-ink/50" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
          </div>
        </label>

        <div class="flex gap-2 md:gap-3 items-center">
          <button id="resetBtn" type="button" aria-label="Reset Permainan"
            class="neu-btn flex-1 rounded-2xl py-2.5 md:py-3 px-3 md:px-4 text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 outline-none focus-visible:ring-2 focus-visible:ring-lavender">
            <svg id="resetIcon" class="w-4 h-4 text-muted shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
            </svg>
            <span class="hidden sm:inline md:inline">Reset</span>
          </button>

          <button id="muteBtn" type="button" aria-label="Matikan atau Nyalakan Suara" aria-pressed="false" title="Mute / Unmute"
            class="neu-btn rounded-2xl p-2.5 md:p-3 flex items-center justify-center outline-none focus-visible:ring-2 focus-visible:ring-lavender">
            <svg id="iconSoundOn" class="w-4 h-4 md:w-5 md:h-5 text-sage" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <svg id="iconSoundOff" class="w-4 h-4 md:w-5 md:h-5 text-ink/45 hidden" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line x1="23" y1="9" x2="17" y2="15"/>
              <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Turn Indicator -->
      <div class="neu-inset rounded-[18px] md:rounded-[20px] p-2.5 sm:p-3 md:p-4">
        <div class="flex gap-2.5 md:gap-3">
          <div id="pillX" class="pill flex-1 rounded-xl md:rounded-2xl px-2.5 py-2 md:py-2.5 flex items-center gap-2">
            <span class="badge w-8 h-8 md:w-9 md:h-9 shrink-0 rounded-lg md:rounded-xl flex items-center justify-center text-base md:text-lg font-extrabold text-muted">X</span>
            <span class="text-xs md:text-sm font-semibold truncate">Anda</span>
            <span class="dot ml-auto"></span>
          </div>
          <div id="pillO" class="pill flex-1 rounded-xl md:rounded-2xl px-2.5 py-2 md:py-2.5 flex items-center gap-2">
            <span class="badge w-8 h-8 md:w-9 md:h-9 shrink-0 rounded-lg md:rounded-xl flex items-center justify-center text-base md:text-lg font-extrabold text-sage">O</span>
            <span class="text-xs md:text-sm font-semibold truncate">AI</span>
            <span class="dot ml-auto"></span>
          </div>
        </div>
        <p id="statusText" class="text-center text-xs sm:text-sm md:text-base font-semibold mt-2.5 md:mt-3 min-h-[1.25rem]">Giliran Anda</p>
      </div>

    </div>
  </aside>

  <!-- BOTTOM AREA (Mobile: full width) / RIGHT AREA (Desktop: centered in remaining space) -->
  <main class="flex-1 flex items-center justify-center px-3 pb-4 pt-1 sm:p-4 md:p-8 min-h-0">
    <div class="board-wrap neu-raised rounded-[22px] md:rounded-[28px] p-3 sm:p-4 md:p-5">
      <div id="board" class="board" role="grid" aria-label="Papan Tic-Tac-Toe"></div>
    </div>
  </main>

  <!-- RESULT MODAL (Auto-Reset) -->
  <div id="resultModal" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-5" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalCard" class="modal-card w-full max-w-[360px] rounded-[24px] p-7 sm:p-8 text-center">
      <div id="modalEmblem" class="modal-emblem w-16 h-16 mx-auto mb-5 rounded-2xl flex items-center justify-center text-3xl font-extrabold"></div>
      <h2 id="modalTitle" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-ink mb-2"></h2>
      <p id="modalMsg" class="text-sm text-ink/70 font-medium mb-6 leading-relaxed"></p>
      <div class="modal-count-pill inline-flex items-center gap-2 rounded-2xl px-4 py-2.5 text-xs font-semibold text-ink/75">
        <span>Merestart dalam</span>
        <span id="modalCount" class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-lavender/45 text-ink font-extrabold">3</span>
      </div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    const HUMAN = 'X';
    const AI = 'O';
    const WIN_SCORE = 1e7;

    const $ = (id) => document.getElementById(id);
    const boardEl = $('board');
    const sizeSel = $('sizeSelect');
    const diffSel = $('difficultySelect');
    const resetBtn = $('resetBtn');
    const muteBtn = $('muteBtn');
    const iconSoundOn = $('iconSoundOn');
    const iconSoundOff = $('iconSoundOff');
    const statusEl = $('statusText');
    const pillX = $('pillX');
    const pillO = $('pillO');
    const modalEl = $('resultModal');
    const modalCard = $('modalCard');
    const modalEmblem = $('modalEmblem');
    const modalTitle = $('modalTitle');
    const modalMsg = $('modalMsg');
    const modalCount = $('modalCount');
    const hasAnime = typeof window.anime === 'function';

    const S = {
      size: 3,
      winLength: 3,
      board: [],
      current: HUMAN,
      over: false,
      busy: false,
      result: null,
      difficulty: 'medium',
      windows: [],
      cellWindows: [],
      sc: [],
      cfg: null,
      deadline: 0,
      token: 0,
      modalDelayTimer: null,
      countdownTimer: null
    };

    const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

    /* =========================================================
       AUDIO ENGINE (Web Audio API: BGM Arpeggio + SFX + Ducking)
       ========================================================= */
    const SFX = (() => {
      let ctx = null;
      let master = null;
      let sfxBus = null;
      let bgmBus = null;
      let echoIn = null;
      let muted = false;
      let bgmStarted = false;
      let bgmStep = 0;
      let duckTimer = null;

      // Pola arpeggio mayor/pentatonik yang ringan & menenangkan (Hz)
      const BGM_NOTES = [
        261.63, 329.63, 392.00, 493.88, // Cmaj7
        220.00, 261.63, 329.63, 392.00, // Am7
        174.61, 220.00, 261.63, 329.63, // Fmaj7
        196.00, 246.94, 293.66, 392.00  // G6
      ];
      const MASTER_VOL = 0.52;
      const BGM_VOL = 0.58;

      function ensure() {
        try {
          if (!ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            ctx = new AC();

            // Compressor mencegah clipping saat chord megah dimainkan bersamaan
            const comp = ctx.createDynamicsCompressor();
            comp.threshold.value = -10;
            comp.knee.value = 18;
            comp.ratio.value = 6;
            comp.attack.value = 0.004;
            comp.release.value = 0.15;

            master = ctx.createGain();
            master.gain.value = muted ? 0 : MASTER_VOL;
            master.connect(comp);
            comp.connect(ctx.destination);

            sfxBus = ctx.createGain();
            sfxBus.gain.value = 1.0;
            sfxBus.connect(master);

            bgmBus = ctx.createGain();
            bgmBus.gain.value = BGM_VOL;
            bgmBus.connect(master);

            // Echo / Delay bus untuk nuansa ruang megah
            const delay = ctx.createDelay(1.0);
            delay.delayTime.value = 0.19;
            const fb = ctx.createGain();
            fb.gain.value = 0.32;
            const wet = ctx.createGain();
            wet.gain.value = 0.35;
            const lp = ctx.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.value = 2600;

            echoIn = ctx.createGain();
            echoIn.connect(delay);
            delay.connect(lp);
            lp.connect(fb);
            fb.connect(delay);
            lp.connect(wet);
            wet.connect(sfxBus);
          }
          if (ctx.state === 'suspended') ctx.resume();
          if (!bgmStarted) startBgm();
          return ctx;
        } catch {
          return null;
        }
      }

      function startBgm() {
        if (bgmStarted || !ctx) return;
        bgmStarted = true;
        const playStep = () => {
          if (!ctx || muted || document.visibilityState === 'hidden') return;
          if (ctx.state === 'suspended') return;
          const freq = BGM_NOTES[bgmStep % BGM_NOTES.length];
          bgmStep++;

          const t = ctx.currentTime + 0.02;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.6, t + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.52);
          osc.connect(g);
          g.connect(bgmBus);
          osc.start(t);
          osc.stop(t + 0.56);
        };
        playStep();
        setInterval(playStep, 420);
      }

      function duckBgm(holdMs = 1350) {
        if (!ctx || !bgmBus) return;
        const t = ctx.currentTime;
        bgmBus.gain.cancelScheduledValues(t);
        bgmBus.gain.setTargetAtTime(0.025, t, 0.05);
        if (duckTimer) clearTimeout(duckTimer);
        duckTimer = setTimeout(() => {
          if (!ctx || !bgmBus) return;
          bgmBus.gain.setTargetAtTime(BGM_VOL, ctx.currentTime, 0.25);
        }, holdMs);
      }

      function toggleMute() {
        muted = !muted;
        if (!ctx && !muted) ensure();
        if (master && ctx) {
          master.gain.setTargetAtTime(muted ? 0 : MASTER_VOL, ctx.currentTime, 0.03);
        }
        return muted;
      }

      function tone(type, f1, f2, dur, vol = 0.35, delay = 0, useEcho = false) {
        const c = ensure();
        if (!c || muted) return;
        const t = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, t);
        if (f2 && f2 !== f1) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
        }
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(sfxBus);
        if (useEcho && echoIn) gain.connect(echoIn);
        osc.start(t);
        osc.stop(t + dur + 0.03);
      }

      function warmChord(freqs, dur, vol, delay = 0, type = 'triangle', cutoff = 2400) {
        const c = ensure();
        if (!c || muted) return;
        const t = c.currentTime + delay;
        const filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(cutoff, t);
        filter.connect(sfxBus);
        if (echoIn) filter.connect(echoIn);

        freqs.forEach((f) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol / freqs.length, t + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(gain);
          gain.connect(filter);
          osc.start(t);
          osc.stop(t + dur + 0.04);
        });
      }

      return {
        ensure,
        toggleMute,
        x() {
          // Pop/click pendek bernada rendah
          tone('sine', 240, 105, 0.085, 0.55);
        },
        o() {
          // Click pendek bernada lebih tinggi
          tone('triangle', 480, 320, 0.075, 0.45);
        },
        win() {
          // Fanfare Kemenangan: duck BGM + arpeggio C-E-G-C + chord mayor megah dengan echo
          duckBgm(1500);
          const arp = [523.25, 659.25, 783.99, 1046.5];
          arp.forEach((f, idx) => {
            tone('triangle', f, f, 0.28, 0.42, idx * 0.085, true);
          });
          // Chord mayor penutup yang megah (C4-E4-G4-C5-G5)
          warmChord([261.63, 329.63, 392.0, 523.25, 783.99], 0.95, 0.85, 0.34, 'triangle', 3400);
        },
        lose() {
          // Game Over: duck BGM + progresi chord minor turun yang megah namun sedih
          duckBgm(1600);
          warmChord([392.0, 466.16, 587.33], 0.34, 0.65, 0.0, 'sawtooth', 1400);   // Gm
          warmChord([349.23, 415.3, 523.25], 0.34, 0.65, 0.28, 'sawtooth', 1200); // Fm
          warmChord([261.63, 311.13, 392.0, 196.0], 0.9, 0.8, 0.56, 'sawtooth', 1000); // Cm dalam
        },
        draw() {
          // Swoosh / buzz tebal yang netral + duck BGM
          duckBgm(750);
          const c = ensure();
          if (!c || muted) return;
          const t = c.currentTime;
          const filter = c.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(950, t);
          filter.frequency.exponentialRampToValueAtTime(220, t + 0.38);
          filter.connect(sfxBus);

          [175, 179].forEach((f) => {
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, t);
            osc.frequency.exponentialRampToValueAtTime(f * 0.72, t + 0.38);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(0.28, t + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
            osc.connect(gain);
            gain.connect(filter);
            osc.start(t);
            osc.stop(t + 0.42);
          });
        }
      };
    })();

    /* =========================================================
       LOGIKA INTI
       ========================================================= */

    // checkWinner generik: baris, kolom, diagonal & anti-diagonal sesuai winLength
    function checkWinner(board, size, winLength) {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const p = board[r * size + c];
          if (!p) continue;
          for (const [dr, dc] of DIRS) {
            const line = [r * size + c];
            for (let k = 1; k < winLength; k++) {
              const nr = r + dr * k;
              const nc = c + dc * k;
              if (nr < 0 || nr >= size || nc < 0 || nc >= size) break;
              if (board[nr * size + nc] !== p) break;
              line.push(nr * size + nc);
            }
            if (line.length === winLength) return { winner: p, line };
          }
        }
      }
      if (board.every(Boolean)) return { winner: 'draw', line: [] };
      return null;
    }

    function buildWindows(size, L) {
      const wins = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          for (const [dr, dc] of DIRS) {
            const er = r + dr * (L - 1);
            const ec = c + dc * (L - 1);
            if (er < 0 || er >= size || ec < 0 || ec >= size) continue;
            const w = [];
            for (let k = 0; k < L; k++) w.push((r + dr * k) * size + (c + dc * k));
            wins.push(w);
          }
        }
      }
      const cellWins = Array.from({ length: size * size }, () => []);
      wins.forEach((w, wi) => w.forEach((idx) => cellWins[idx].push(wi)));
      S.windows = wins;
      S.cellWindows = cellWins;

      const sc = [];
      for (let k = 0; k <= L; k++) {
        sc.push(k === 0 ? 0 : k === L ? 100000 : k === L - 1 ? 1000 : Math.pow(8, k));
      }
      S.sc = sc;
    }

    function winsAt(board, idx, p) {
      if (idx < 0) return false;
      for (const wi of S.cellWindows[idx]) {
        const w = S.windows[wi];
        let ok = true;
        for (let k = 0; k < w.length; k++) {
          if (board[w[k]] !== p) { ok = false; break; }
        }
        if (ok) return true;
      }
      return false;
    }

    const emptyCells = (board) => {
      const e = [];
      for (let i = 0; i < board.length; i++) if (!board[i]) e.push(i);
      return e;
    };

    const randomOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

    /* =========================================================
       HEURISTIK POLA SEJAJAR (3x3 -> 3, 4x4/5x5 -> 4-sejajar)
       ========================================================= */
    function evaluate(board) {
      let score = 0;
      const sc = S.sc;
      for (const w of S.windows) {
        let a = 0;
        let h = 0;
        for (let k = 0; k < w.length; k++) {
          const v = board[w[k]];
          if (v === AI) a++;
          else if (v === HUMAN) h++;
        }
        if (a && h) continue;
        if (a) score += sc[a];
        else if (h) score -= sc[h] * 1.25;
      }
      return score;
    }

    function moveScore(board, idx, p) {
      const sc = S.sc;
      let s = 0;
      for (const wi of S.cellWindows[idx]) {
        const w = S.windows[wi];
        let own = 0;
        let opp = 0;
        for (let k = 0; k < w.length; k++) {
          const v = board[w[k]];
          if (!v) continue;
          if (v === p) own++;
          else opp++;
        }
        if (!opp) s += sc[own + 1];
        if (!own) s += sc[opp + 1] * 0.9;
      }
      return s;
    }

    function getCandidates(board) {
      const n = S.size;
      const all = emptyCells(board);
      if (n === 3 || all.length === n * n) return all;
      const out = [];
      for (const i of all) {
        const r = (i / n) | 0;
        const c = i % n;
        let near = false;
        outer:
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue;
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
            if (board[nr * n + nc]) { near = true; break outer; }
          }
        }
        if (near) out.push(i);
      }
      return out.length ? out : all;
    }

    function orderedMoves(board, p, limit) {
      return getCandidates(board)
        .map((i) => ({ i, s: moveScore(board, i, p) }))
        .sort((a, b) => b.s - a.s)
        .slice(0, limit)
        .map((m) => m.i);
    }

    /* =========================================================
       MINIMAX + ALPHA-BETA PRUNING (depth-limited 5-6)
       ========================================================= */
    function minimax(board, depth, alpha, beta, maximizing, last, empties) {
      const lastP = maximizing ? HUMAN : AI;
      if (winsAt(board, last, lastP)) {
        return lastP === AI ? WIN_SCORE + depth : -WIN_SCORE - depth;
      }
      if (empties === 0) return 0;
      if (depth === 0 || performance.now() > S.deadline) return evaluate(board);

      const p = maximizing ? AI : HUMAN;
      const moves = orderedMoves(board, p, S.cfg.branch);
      let best = maximizing ? -Infinity : Infinity;

      for (const m of moves) {
        board[m] = p;
        const v = minimax(board, depth - 1, alpha, beta, !maximizing, m, empties - 1);
        board[m] = null;
        if (maximizing) {
          if (v > best) best = v;
          if (best > alpha) alpha = best;
        } else {
          if (v < best) best = v;
          if (best < beta) beta = best;
        }
        if (alpha >= beta) break;
      }
      return best;
    }

    function depthConfig(size) {
      if (size === 3) return { depth: 6, branch: 9, rootBranch: 9 };
      if (size === 4) return { depth: 6, branch: 10, rootBranch: 14 };
      return { depth: 5, branch: 10, rootBranch: 14 };
    }

    /* =========================================================
       STRATEGI AI
       ========================================================= */
    function easyMove(board) {
      return randomOf(emptyCells(board));
    }

    function mediumMove(board) {
      const empties = emptyCells(board);
      for (const m of empties) {
        board[m] = HUMAN;
        const threat = winsAt(board, m, HUMAN);
        board[m] = null;
        if (threat) return m;
      }
      return randomOf(empties);
    }

    function hardMove(board) {
      const n = S.size;
      const empties = emptyCells(board);

      if (empties.length === n * n) {
        if (n % 2) return ((n - 1) / 2) * n + (n - 1) / 2;
        const h = n / 2;
        return randomOf([(h - 1) * n + h - 1, (h - 1) * n + h, h * n + h - 1, h * n + h]);
      }

      for (const m of empties) {
        board[m] = AI;
        const w = winsAt(board, m, AI);
        board[m] = null;
        if (w) return m;
      }

      for (const m of empties) {
        board[m] = HUMAN;
        const w = winsAt(board, m, HUMAN);
        board[m] = null;
        if (w) return m;
      }

      S.cfg = depthConfig(n);
      S.deadline = performance.now() + 900;

      const moves = orderedMoves(board, AI, S.cfg.rootBranch);
      let best = moves[0];
      let bestV = -Infinity;
      let alpha = -Infinity;

      for (const m of moves) {
        board[m] = AI;
        const v = minimax(board, S.cfg.depth - 1, alpha, Infinity, false, m, empties.length - 1);
        board[m] = null;
        if (v > bestV) { bestV = v; best = m; }
        if (bestV > alpha) alpha = bestV;
      }
      return best;
    }

    function chooseAIMove() {
      const b = S.board.slice();
      switch (S.difficulty) {
        case 'easy': return easyMove(b);
        case 'hard': return hardMove(b);
        default: return mediumMove(b);
      }
    }

    /* =========================================================
       UI & ALUR PERMAINAN
       ========================================================= */
    function buildBoard() {
      const n = S.size;
      const gap = n === 3 ? 12 : n === 4 ? 10 : 8;
      const radius = n === 3 ? 22 : n === 4 ? 18 : 16;

      boardEl.style.setProperty('--n', n);
      boardEl.style.setProperty('--gap', gap + 'px');
      boardEl.style.setProperty('--r', radius + 'px');
      boardEl.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
      boardEl.style.gridTemplateRows = `repeat(${n}, minmax(0, 1fr))`;
      boardEl.classList.remove('locked', 'done');
      boardEl.innerHTML = '';

      for (let i = 0; i < n * n; i++) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.dataset.i = i;
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', `Baris ${Math.floor(i / n) + 1}, kolom ${(i % n) + 1}`);
        cell.addEventListener('click', () => handleCellClick(i));
        boardEl.appendChild(cell);
      }

      if (hasAnime) {
        anime({
          targets: boardEl.children,
          scale: [0.85, 1],
          opacity: [0, 1],
          duration: 450,
          easing: 'easeOutQuart',
          delay: anime.stagger(25, { grid: [n, n], from: 'center' })
        });
      }
    }

    function renderMark(i, p) {
      const cell = boardEl.children[i];
      if (!cell) return;
      cell.classList.add('filled', p === HUMAN ? 'is-x' : 'is-o');
      cell.setAttribute('aria-label', cell.getAttribute('aria-label') + ': ' + p);
      const span = document.createElement('span');
      span.className = 'mark';
      span.textContent = p;
      cell.appendChild(span);

      if (hasAnime) {
        anime({
          targets: span,
          scale: [0, 1],
          rotate: p === HUMAN ? [-90, 0] : [0, 0],
          opacity: [0, 1],
          duration: 600,
          easing: 'easeOutElastic(1, .55)'
        });
      }
    }

    function highlightWin(line) {
      const cells = line.map((i) => boardEl.children[i]);
      cells.forEach((c) => c.classList.add('win'));
      if (hasAnime) {
        anime({
          targets: cells,
          scale: [1, 1.08, 1],
          duration: 650,
          easing: 'easeInOutSine',
          delay: anime.stagger(80)
        });
      }
    }

    function setStatus(html) {
      if (statusEl.innerHTML === html) return;
      statusEl.innerHTML = html;
      if (hasAnime) {
        anime.remove(statusEl);
        anime({ targets: statusEl, opacity: [0, 1], translateY: [5, 0], duration: 300, easing: 'easeOutQuad' });
      }
    }

    function updateStatus() {
      pillX.classList.remove('active');
      pillO.classList.remove('active');
      boardEl.classList.toggle('locked', S.over || S.busy);

      if (S.over) {
        boardEl.classList.add('done');
        const w = S.result.winner;
        if (w === HUMAN) {
          pillX.classList.add('active');
          setStatus('<span class="text-muted">X</span> Menang — Selamat!');
        } else if (w === AI) {
          pillO.classList.add('active');
          setStatus('<span class="text-sage">O</span> (AI) Menang');
        } else {
          setStatus('Permainan Seri');
        }
        return;
      }

      if (S.current === HUMAN) {
        pillX.classList.add('active');
        setStatus('Giliran Anda — <span class="text-muted font-extrabold">X</span>');
      } else {
        pillO.classList.add('active');
        setStatus('AI <span class="text-sage font-extrabold">O</span> berpikir<span class="thinking"><span>.</span><span>.</span><span>.</span></span>');
      }
    }

    function clearModalTimers() {
      if (S.modalDelayTimer) {
        clearTimeout(S.modalDelayTimer);
        S.modalDelayTimer = null;
      }
      if (S.countdownTimer) {
        clearInterval(S.countdownTimer);
        S.countdownTimer = null;
      }
    }

    function hideResultModal(immediate) {
      if (modalEl.classList.contains('hidden')) return;
      if (immediate || !hasAnime) {
        modalEl.classList.add('hidden');
        modalEl.classList.remove('flex');
        return;
      }
      anime.remove([modalEl, modalCard]);
      anime({
        targets: modalCard,
        scale: [1, 0.9],
        opacity: [1, 0],
        duration: 280,
        easing: 'easeInQuad'
      });
      anime({
        targets: modalEl,
        opacity: [1, 0],
        duration: 280,
        easing: 'easeInQuad',
        complete: () => {
          modalEl.classList.add('hidden');
          modalEl.classList.remove('flex');
          modalEl.style.opacity = '';
          modalCard.style.opacity = '';
          modalCard.style.transform = '';
        }
      });
    }

    function showResultModal(winner) {
      const token = S.token;
      if (winner === HUMAN) {
        SFX.win();
        modalEmblem.textContent = 'X';
        modalEmblem.className = 'modal-emblem w-16 h-16 mx-auto mb-5 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-muted';
        modalTitle.textContent = 'Victory!';
        modalMsg.textContent = 'Selamat, Anda berhasil mengalahkan AI.';
      } else if (winner === AI) {
        SFX.lose();
        modalEmblem.textContent = 'O';
        modalEmblem.className = 'modal-emblem w-16 h-16 mx-auto mb-5 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-sage';
        modalTitle.textContent = 'Defeat';
        modalMsg.textContent = 'AI berhasil memenangkan ronde ini.';
      } else {
        SFX.draw();
        modalEmblem.textContent = 'XO';
        modalEmblem.className = 'modal-emblem w-16 h-16 mx-auto mb-5 rounded-2xl flex items-center justify-center text-xl font-extrabold text-ink/70';
        modalTitle.textContent = 'Draw';
        modalMsg.textContent = 'Pertandingan berakhir seimbang.';
      }

      let sec = 3;
      modalCount.textContent = sec;

      modalEl.classList.remove('hidden');
      modalEl.classList.add('flex');

      if (hasAnime) {
        anime.remove([modalEl, modalCard]);
        anime({
          targets: modalEl,
          opacity: [0, 1],
          duration: 320,
          easing: 'easeOutQuad'
        });
        anime({
          targets: modalCard,
          scale: [0.84, 1],
          opacity: [0, 1],
          duration: 420,
          easing: 'easeOutBack(1.4)'
        });
      }

      S.countdownTimer = setInterval(() => {
        if (token !== S.token) {
          clearModalTimers();
          return;
        }
        sec--;
        if (sec > 0) {
          modalCount.textContent = sec;
          if (hasAnime) {
            anime({ targets: modalCount, scale: [1.25, 1], duration: 280, easing: 'easeOutQuad' });
          }
        } else {
          clearModalTimers();
          hideResultModal(false);
          setTimeout(() => {
            if (token === S.token) resetGame();
          }, 290);
        }
      }, 1000);
    }

    function makeMove(i, p) {
      S.board[i] = p;
      renderMark(i, p);
      if (p === HUMAN) SFX.x();
      else SFX.o();

      const res = checkWinner(S.board, S.size, S.winLength);
      if (res) {
        S.over = true;
        S.result = res;

        if (res.winner !== 'draw') highlightWin(res.line);
        const token = S.token;
        S.modalDelayTimer = setTimeout(() => {
          if (token === S.token && S.over) showResultModal(res.winner);
        }, 480);
      }
    }

    function handleCellClick(i) {
      if (S.over || S.busy || S.current !== HUMAN || S.board[i]) return;
      SFX.ensure();

      makeMove(i, HUMAN);
      if (S.over) { updateStatus(); return; }

      S.current = AI;
      S.busy = true;
      updateStatus();

      const token = S.token;
      setTimeout(() => {
        if (token !== S.token) return;
        const m = chooseAIMove();
        if (token !== S.token) return;
        if (m !== undefined && !S.board[m]) makeMove(m, AI);
        S.busy = false;
        if (!S.over) S.current = HUMAN;
        updateStatus();
      }, 360);
    }

    function resetGame() {
      S.token++;
      clearModalTimers();
      hideResultModal(true);
      S.size = parseInt(sizeSel.value, 10);
      S.winLength = Math.min(4, S.size);
      S.difficulty = diffSel.value;
      S.board = Array(S.size * S.size).fill(null);
      S.current = HUMAN;
      S.over = false;
      S.busy = false;
      S.result = null;

      buildWindows(S.size, S.winLength);
      buildBoard();
      updateStatus();
    }

    /* ---------- Events ---------- */
    sizeSel.addEventListener('change', () => {
      SFX.ensure();
      resetGame();
    });
    diffSel.addEventListener('change', () => {
      SFX.ensure();
      S.difficulty = diffSel.value;
    });
    resetBtn.addEventListener('click', () => {
      SFX.ensure();
      if (hasAnime) {
        anime({ targets: '#resetIcon', rotate: '-=360', duration: 600, easing: 'easeOutCubic' });
      }
      resetGame();
    });
    muteBtn.addEventListener('click', () => {
      const isMuted = SFX.toggleMute();
      muteBtn.setAttribute('aria-pressed', String(isMuted));
      iconSoundOn.classList.toggle('hidden', isMuted);
      iconSoundOff.classList.toggle('hidden', !isMuted);
    });

    resetGame();
  })();
  </script>
